<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お天気チェッカー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>お天気チェッカー</h1>
      <p class="subtitle">都市名を入力すると、現在の気温と48時間の気温・降水確率の推移を表示します</p>
    </header>

    <form id="search-form" class="search" autocomplete="off">
      <input id="city-input" type="text" placeholder="都市名を入力(例:京都、東京、Paris)" value="京都" aria-label="都市名" enterkeyhint="search" required>
      <button type="submit">検索</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="candidates" class="card candidates" hidden>
      <h3 id="candidates-title"></h3>
      <ul id="candidate-list" class="candidate-list"></ul>
    </section>

    <section id="result" class="result" hidden>
      <div class="card current">
        <div class="location">
          <h2 id="city-name"></h2>
          <p id="city-detail" class="detail"></p>
        </div>
        <div class="now">
          <span id="weather-icon" class="icon" aria-hidden="true"></span>
          <span id="current-temp" class="temp"></span>
        </div>
        <p id="weather-text" class="weather-text"></p>
        <p id="current-precip" class="precip"></p>
        <p id="updated-at" class="detail"></p>
      </div>

      <div class="card chart-card">
        <h3>今後48時間の気温と降水確率</h3>
        <div class="chart-wrap">
          <canvas id="temp-chart" aria-label="今後48時間の気温と降水確率のグラフ" role="img"></canvas>
        </div>
        <p id="minmax" class="detail"></p>
      </div>

      <div id="map-card" class="card map-card">
        <h3>周辺の地図</h3>
        <div id="map" class="map" aria-label="検索した地点の周辺の地図"></div>
      </div>
    </section>

    <footer>
      天気データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      / 地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
